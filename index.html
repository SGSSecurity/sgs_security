<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGS SECURITY – Sécurité privée et gardiennage</title>
<meta name="description" content="SGS SECURITY : gardiennage, surveillance, contrôle d’accès et protection des biens et des personnes. Votre sécurité, notre priorité.">
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
:root{--y:#EFBF24;--b:#68421F;--bd:#3D2818;--bg:#fff;--ink:#2a1d12;--mut:#6b5a4b;--card:#fff;--line:#e8e0d0;--alt:#F3F3F1;--hd:#3D2818;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c130c;--ink:#f5ecdc;--mut:#c9b9a3;--card:#2a1d12;--line:#4a3523;--alt:#24180f;--hd:#EFBF24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c130c;--ink:#f5ecdc;--mut:#c9b9a3;--card:#2a1d12;--line:#4a3523;--alt:#24180f;--hd:#EFBF24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font:16px/1.65 "Century Gothic",CenturyGothic,Questrial,"URW Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bd);z-index:30}
a{color:inherit}img{max-width:100%}
.w{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bd);color:#fff}
.hd{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.lg{width:48px;height:48px;border-radius:10px;background:#fff;padding:2px;object-fit:contain}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.05em;text-decoration:none}
nav{display:flex;align-items:center;gap:4px}
nav a:not(.btn){padding:8px 12px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:600}
nav a.on,nav a:not(.btn):hover{color:var(--y)}
.mb{display:none;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;border:2px solid var(--y);background:var(--y);color:var(--bd);font:inherit;font-weight:800;text-decoration:none;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0003}
.btn.o{background:transparent;color:#fff}
nav .btn{padding:9px 16px}
section{padding:72px 0}
.alt{background:var(--alt)}.dk{background:var(--bd);color:#fff}
h1{font-size:clamp(34px,6vw,60px);line-height:1.1}
h2{font-size:clamp(26px,4vw,38px);line-height:1.2;color:var(--hd);margin-bottom:20px}
.dk h2,.hero h2{color:#fff}.dk p{opacity:.9}
p{margin-bottom:14px;color:var(--mut)}.dk p,.hero p{color:inherit}
.hero{padding:110px 0 100px;color:#fff;background:linear-gradient(90deg,rgba(61,40,24,.93),rgba(61,40,24,.72) 60%,rgba(61,40,24,.4)),var(--himg,linear-gradient(135deg,#68421F,#3D2818));background-size:cover;background-position:center 30%}
.hero h1{max-width:760px;margin:18px 0}.hero p{max-width:560px;font-size:19px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--y);border-radius:99px;font-size:14px;font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--y);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.3}}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.g{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.two{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;transition:.25s}
.c:hover{transform:translateY(-4px);box-shadow:0 12px 28px #3d281826;border-color:var(--y)}
.c h3{color:var(--hd);margin-bottom:8px;font-size:18px}.c p{margin-bottom:10px}
.n{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--y);color:var(--bd);font-weight:800;margin-bottom:14px}
.lc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph{min-height:300px;border-radius:16px;background:linear-gradient(135deg,var(--b),var(--bd));display:grid;place-items:center;color:#FFF8E8;text-align:center;padding:20px;font-size:14px}
.pi{width:100%;height:clamp(340px,60vw,520px);object-fit:cover;border-radius:16px}
.sv{display:grid;grid-template-columns:60px 1fr;gap:16px;padding:28px 0;border-bottom:1px solid var(--line)}
.sim{background:var(--bd);color:#fff;border-radius:16px;padding:32px}
.q{display:flex;gap:8px;margin:12px 0 20px}.q button{width:52px;border-radius:10px;border:0;background:var(--y);color:var(--bd);font-size:26px;font-weight:800;cursor:pointer}
.q input{width:110px;text-align:center;font-size:22px;font-weight:800;margin:0}
.tot{font-size:clamp(32px,7vw,52px);font-weight:800;color:var(--y);line-height:1.1}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input[readonly]{opacity:.8}
.fg{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ck input{width:auto;margin:0 8px 0 0}.hp{position:absolute;left:-9999px}
.err{color:#c0392b;display:block;font-weight:400}
.out{margin-top:14px;border-radius:10px}.out.ok,.out.ko{padding:14px}.out.ok{background:#e6f4e6;color:#1b5e20}.out.ko{background:#fdecea;color:#8a1c12}
.todo{opacity:.6}.s{font-size:14px}
footer{background:var(--bd);color:#f5ecdc;padding:56px 0 24px}footer a,.lk{display:block;color:inherit;text-decoration:none;opacity:.85;margin:6px 0}footer a:hover,.lk:hover{color:var(--y)}
footer p{color:inherit;opacity:.85}.fl{color:var(--y);font-size:20px}
.lk{background:none;border:0;font:inherit;cursor:pointer;display:inline;padding:0}
.bt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:36px;padding-top:20px;border-top:1px solid #ffffff30;font-size:14px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 6px 18px #0004}
dialog{max-width:520px;width:90%;border:0;border-radius:14px;padding:24px;background:var(--card);color:var(--ink)}
.rv{opacity:0;transform:translateY(16px);transition:.6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.pill i{animation:none}}
@media(max-width:860px){.mb{display:block}nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bd);flex-direction:column;align-items:stretch;padding:12px 20px 20px}nav.open{display:flex}section{padding:52px 0}.hero{padding:72px 0;background-image:linear-gradient(rgba(61,40,24,.85),rgba(61,40,24,.8)),var(--himg,linear-gradient(135deg,#68421F,#3D2818))}}
</style></head><body>

const engage=()=>head("Votre confiance nous engage.","Les principes qui guident chacune de nos missions.")+`<section><div class="w two rv"><div><h2>Sur le terrain, au quotidien.</h2><p>Nos agents interviennent en uniforme, avec la rigueur et la discipline qu’exige votre sécurité.</p></div>${ph("engage","agents de sécurité SGS SECURITY en tenue","50% 45%")}</div></section><section class="alt"><div class="w g">${M(E,(e,i)=>card(e[0],e[1],i+1))}</div></section>`+endcta("Travaillons ensemble.","Demandez un devis ou contactez notre équipe.");
const F=(n,l,r,t="text")=>`<label>${l}${r?" *":""}<input name="${n}" type="${t}"${r?" required":""}></label>`;
const devis=()=>head("Demander un devis","Estimez le coût de votre prestation, puis transmettez votre demande à SGS SECURITY.")+`<section><div class="w"><div class="two" style="align-items:start"><div class="sim"><h2>Simulateur de tarif</h2><p><b>Tarif unitaire : ${fmt(P)} HT / agent / mois</b></p><label for="n">Nombre d’agents</label><div class="q"><button type="button" id="m" aria-label="Moins">−</button><input id="n" type="number" min="1" value="1" inputmode="numeric"><button type="button" id="p" aria-label="Plus">+</button></div><p>Total mensuel HT</p><div class="tot" id="tot" aria-live="polite"></div><p id="fm" class="s"></p><p class="s">Estimation indicative hors taxes. Le montant définitif et les conditions de la prestation seront confirmés par SGS SECURITY après étude de votre demande.</p></div>
<div class="c"><h3>Exemples de calcul</h3><table><tr><th>Agents</th><th>Tarif mensuel HT</th></tr>${M([1,2,3,5,10,20],n=>`<tr><td>${n} agent${n>1?"s":""}</td><td>${fmt(n*P)}</td></tr>`)}</table></div></div>
<form class="c" id="fq" novalidate style="margin-top:32px"><h2>Votre demande de devis</h2><div class="fg">${F("nom","Nom et prénom",1)}${F("entreprise","Entreprise ou organisation (facultatif)")}${F("tel","Téléphone",1,"tel")}${F("email","Adresse e-mail",1,"email")}<label>Type de prestation *<select name="prestation" required><option value="">Choisir…</option>${M(S,(s,i)=>`<option${i===PRE?" selected":""}>${s[0]}</option>`)}</select></label><label>Nombre d’agents<input id="fa" name="agents" readonly></label><label>Durée de la prestation *<select name="duree" required><option value="">Choisir…</option><option>Prestation ponctuelle</option><option>Prestation récurrente</option></select></label>${F("precision","Précisions sur la durée")}${F("lieu","Lieu d’intervention",1)}${F("debut","Date souhaitée de début",1,"date")}</div><label>Montant mensuel estimé<input id="ft" name="montant_estime" readonly></label><label>Informations complémentaires<textarea name="infos" rows="4"></textarea></label>${tail("Envoyer ma demande de devis")}</form></div></section>`;
const tail=b=>`<label class="hp">Ne pas remplir<input name="site" tabindex="-1" autocomplete="off"></label><label class="ck"><input type="checkbox" name="consent" required> J’accepte que mes données soient utilisées pour traiter ma demande. *</label><button class="btn" type="submit">${b}</button><div class="out" role="status"></div>`;
const ci=(l,v,h)=>`<p><b>${l}</b><br>${v?(h?`<a href="${h}${h=="mailto:"?v:h[0]=="h"?v.replace(/\D/g,""):v.replace(/[^\d+]/g,"")}">${v}</a>`:v):`<em class="todo">À renseigner</em>`}</p>`;
const contact=()=>head("Parlons de vos besoins en sécurité.","Notre équipe est à votre disposition pour répondre à vos questions et vous accompagner dans la recherche d’une solution adaptée.")+`<section><div class="w two" style="align-items:start"><div>${ci("Téléphone",CFG.tel,"tel:")}${ci("WhatsApp",CFG.wa,"https://wa.me/")}${ci("E-mail",CFG.email,"mailto:")}${ci("Adresse et localisation",CFG.addr)}${ci("Horaires de disponibilité",CFG.hours)}${CFG.wa?cta("Écrire sur WhatsApp","x").replace('href="#x"',`href="https://wa.me/${CFG.wa.replace(/\D/g,"")}"`):""}${CFG.map?`<iframe src="${CFG.map}" loading="lazy" style="width:100%;height:240px;border:0;border-radius:14px;margin-top:16px" title="Carte"></iframe>`:`<div class="ph" style="min-height:200px;margin-top:16px">Carte Google Maps à intégrer lorsque l’adresse exacte sera disponible</div>`}</div>
<form class="c" id="fc" novalidate><h2 style="font-size:26px">Envoyer un message</h2>${F("nom","Nom et prénom",1)}${F("email","Adresse e-mail",1,"email")}${F("tel","Téléphone",1,"tel")}${F("objet","Objet du message",1)}<label>Message *<textarea name="message" rows="5" required></textarea></label>${tail("Envoyer mon message")}</form></div></section>`;
const R={accueil:[home,"SGS SECURITY – Sécurité privée et gardiennage","Gardiennage, surveillance, contrôle d’accès et protection des biens et des personnes. Votre sécurité, notre priorité."],"a-propos":[about,"À propos – SGS SECURITY","Mission, vision, approche et valeurs de SGS SECURITY, entreprise de sécurité privée et de gardiennage."],services:[services,"Nos services – SGS SECURITY","Neuf prestations de sécurité : gardiennage, contrôle d’accès, rondes, événements, télésurveillance, audit et prévention."],engagements:[engage,"Nos engagements – SGS SECURITY","Professionnalisme, disponibilité, rigueur, réactivité, discrétion et adaptabilité : les engagements de SGS SECURITY."],devis:[devis,"Demander un devis – SGS SECURITY","Simulez le coût de votre prestation (90 000 FCFA HT par agent et par mois) et demandez un devis à SGS SECURITY."],contact:[contact,"Contact – SGS SECURITY","Contactez SGS SECURITY pour vos besoins en sécurité privée et gardiennage."]};
function check(f){let ok=1;f.querySelectorAll("[name]").forEach(el=>{const l=el.closest("label");let e=l.querySelector(".err");if(!e){e=document.createElement("small");e.className="err";l.append(e)}const v=el.value.trim(),c=el.type=="checkbox";let m="";if(el.required&&(c?!el.checked:!v))m=c?"Votre consentement est nécessaire.":"Ce champ est obligatoire.";else if(v&&el.type=="email"&&!/^\S+@\S+\.\S+$/.test(v))m="Adresse e-mail invalide.";else if(v&&el.type=="tel"&&v.replace(/\D/g,"").length<8)m="Numéro de téléphone invalide.";e.textContent=m;if(m)ok=0});return ok}
const LBL={nom:"Nom et prénom",entreprise:"Entreprise / organisation",tel:"Téléphone",email:"email",prestation:"Type de prestation",agents:"Nombre d’agents",duree:"Durée de la prestation",precision:"Précisions sur la durée",lieu:"Lieu d’intervention",debut:"Date de début souhaitée",montant_estime:"Montant mensuel estimé (HT)",infos:"Informations complémentaires",objet:"Objet",message:"Message",consent:"Consentement au traitement des données"};
const lab=d=>Object.fromEntries(Object.entries(d).filter(x=>x[1]!=="").map(([k,v])=>[LBL[k]||k,k=="consent"?"Oui":v]));
function bind(f){f.onsubmit=async e=>{e.preventDefault();const o=f.querySelector(".out"),set=(c,t)=>{o.className="out "+c;o.textContent=t},alt=L=>{const t=encodeURIComponent(Object.entries(L).map(x=>x.join(" : ")).join("\n"));if(CFG.wa)o.insertAdjacentHTML("beforeend",` <a class="btn" style="margin:10px 8px 0 0" href="https://wa.me/${CFG.wa.replace(/\D/g,"")}?text=${t}">Envoyer par WhatsApp</a>`);if(CFG.email)o.insertAdjacentHTML("beforeend",` <a class="btn" style="margin:10px 8px 0 0" href="mailto:${CFG.email}?subject=Demande%20SGS%20SECURITY&body=${t}">Envoyer par e-mail</a>`)};
set("","");if(!check(f))return;const d=Object.fromEntries(new FormData(f));if(d.site)return;delete d.site;const L=lab(d),SJ="SGS SECURITY – "+(f.id=="fq"?"Nouvelle demande de devis de "+d.nom:"Nouveau message : "+d.objet);
if(Date.now()-(window.LS||0)<30000)return set("ko","Veuillez patienter quelques secondes avant un nouvel envoi.");
if(!CFG.endpoint){set("ko","Votre demande n’a pas encore été transmise. Envoyez-la en un clic :");return alt(L)}
try{const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(CFG.key?{...L,access_key:CFG.key,subject:SJ}:{...L,_subject:SJ,_template:"table",_captcha:"false"})});const j=await r.json().catch(()=>({}));if(!r.ok||String(j.success)=="false")throw 0;window.LS=Date.now();f.reset();if(f.id=="fq")SU();set("ok","Merci, votre demande a bien été transmise à SGS SECURITY. Nous revenons vers vous rapidement.")}catch{set("ko","L’envoi n’a pas abouti. Vous pouvez nous transmettre votre demande directement :");alt(L)}}}
function sim(){const n=$("#n"),u=()=>{const v=Math.max(1,parseInt(n.value)||1);$("#tot").textContent=fmt(v*P);$("#fm").textContent=`${v} × ${fmt(P)} = ${fmt(v*P)} HT / mois`;$("#fa").value=v;$("#ft").value=fmt(v*P)+" HT"};$("#m").onclick=()=>{n.value=Math.max(1,(parseInt(n.value)||1)-1);u()};$("#p").onclick=()=>{n.value=(parseInt(n.value)||0)+1;u()};window.SU=u;n.oninput=u;n.onchange=()=>{n.value=Math.max(1,parseInt(n.value)||1);u()};u()}
function go(){const k=R[location.hash.slice(1)]?location.hash.slice(1):"accueil",r=R[k];$("#app").innerHTML=r[0]();document.title=r[1];$('meta[name="description"]').content=r[2];
if(CFG.img.hero&&k=="accueil")$(".hero").style.setProperty("--himg",`url(${CFG.img.hero})`);
document.querySelectorAll("nav a:not(.btn)").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+k));$("#nav").classList.remove("open");
document.querySelectorAll("form").forEach(bind);if(k=="devis")sim();window.scrollTo(0,0);
const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1}):null;document.querySelectorAll(".rv").forEach(x=>io?io.observe(x):x.classList.add("in"))}
$("#nav").innerHTML=M(NAV.filter(n=>n[0]!="devis"),n=>`<a href="#${n[0]}">${n[1]}</a>`)+cta("Demander un devis","devis");
$(".mb").onclick=()=>$(".mb").setAttribute("aria-expanded",$("#nav").classList.toggle("open"));
const L={legal:"<h2>Mentions légales</h2><p>Éditeur du site : SGS SECURITY. La raison sociale, l’adresse du siège, le numéro d’immatriculation et le responsable de publication sont à renseigner par l’entreprise.</p>",priv:"<h2>Politique de confidentialité</h2><p>Les informations saisies dans les formulaires (identité, téléphone, e-mail, détails de la demande) servent uniquement à traiter votre demande. Vous pouvez demander leur accès, leur rectification ou leur suppression en contactant SGS SECURITY.</p>"};
$("#ft").innerHTML=`<footer><div class="w g"><div><img class="lg" src="${IMG.logo}" alt="Logo SGS SECURITY" style="width:76px;height:76px;margin-bottom:10px"><br><b class="fl">SGS SECURITY</b><p>Votre sécurité, notre priorité.</p><p class="s">Entreprise spécialisée dans la sécurité privée, le gardiennage et la protection des biens et des personnes.</p></div><div><b>Navigation</b>${M(NAV,n=>`<a href="#${n[0]}">${n[1]}</a>`)}</div><div><b>Nos services</b>${M([0,1,3,5,7],i=>`<a href="#services">${S[i][0]}</a>`)}</div><div><b>Contact</b>${ci("Téléphone",CFG.tel,"tel:")}${ci("E-mail",CFG.email,"mailto:")}${ci("Adresse",CFG.addr)}${ci("WhatsApp",CFG.wa,"https://wa.me/")}</div></div><div class="w bt"><span>© ${new Date().getFullYear()} SGS SECURITY. Tous droits réservés.</span><span><button class="lk" data-l="legal">Mentions légales</button> · <button class="lk" data-l="priv">Politique de confidentialité</button></span></div></footer>`+(CFG.wa?`<a class="btn wa" href="https://wa.me/${CFG.wa.replace(/\D/g,"")}">WhatsApp</a>`:"");
document.querySelectorAll(".lk").forEach(b=>b.onclick=()=>{$("#dt").innerHTML=L[b.dataset.l];dl.showModal()});
$(".lg").src=IMG.logo;addEventListener("hashchange",go);go();
</script></body></html>
